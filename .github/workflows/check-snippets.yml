name: Check for new snippets in @eyeo/snippets

on:
  schedule:
    - cron: '0 9 * * 5'  # Every Friday at 09:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  check-snippets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install latest @eyeo/snippets
        run: npm install @eyeo/snippets@latest --no-save

      - name: Run snippet comparison
        id: check
        run: |
          set +e
          output=$(node .github/scripts/check-snippets.mjs 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          delimiter=$(openssl rand -hex 8)
          echo "output<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

      - name: Open PR if new snippets found
        if: steps.check.outputs.exit_code == '2'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/new-snippets-detected
          title: 'New snippets detected in @eyeo/snippets'
          body: |
            The following snippet(s) were found in `@eyeo/snippets` and have been auto-added to `src/data/snippets.json` with detected argument definitions:

            ```
            ${{ steps.check.outputs.output }}
            ```

            **Action required:** Review the auto-detected argument definitions in `src/data/snippets.json`. For each snippet:
            - Verify the Adblock Plus `since` version; replace `unknown` using upstream documentation or release history
            - Verify `required` flags and fix any that are incorrect
            - Add any missing `enum` values (run `node .github/scripts/inspect-snippet.mjs <snippet-name>` locally to inspect the source)
            - Add special fields if needed (`category`, `noRace`, `max`, etc.)
            - If the log above contains a `DRIFT_DETECTED` section, those entries need the same manual enum/field review as new snippets do

            Reference: [@eyeo/snippets source](https://gitlab.com/eyeo/anti-cv/snippets)
          commit-message: 'chore: flag new snippets from @eyeo/snippets'
          labels: 'snippets,maintenance'

      - name: Fail if snippet schema drift was detected
        if: steps.check.outputs.exit_code == '3' || (steps.check.outputs.exit_code == '2' && contains(steps.check.outputs.output, 'DRIFT_DETECTED'))
        run: |
          echo "::error::Existing snippet schemas have drifted from upstream — see the DRIFT_DETECTED block above."
          exit 1

      - name: Fail if snippet comparison could not complete
        if: steps.check.outputs.exit_code != '0' && steps.check.outputs.exit_code != '2' && steps.check.outputs.exit_code != '3'
        run: |
          echo "::error::Snippet comparison failed — compatibility is unknown. See the script error above; this is not a schema-drift result."
          exit 1
